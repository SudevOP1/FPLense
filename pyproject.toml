[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fPLense"
version = "0.1.0"
description = "Fantasy Premier League points forecaster and squad optimizer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sudev" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fPLense = ["etl/*.csv", "db/sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the downloaded data lake (data/lake/); skipped when absent",
]
addopts = "-m 'not data'"
# PuLP 3.3 warns that LpVariable.dicts / PULP_CBC_CMD go away in 4.0; we pin pulp<4 on purpose
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]
